name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signals-gate:
    name: Typecheck, lint, signals gate, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Signals gate (blocking test suite)
        run: npm run test:signals-gate

      - name: Build
        run: npm run build
        env:
          SESSION_SECRET: ci-only-session-secret-not-used-in-prod
          NODE_ENV: production

  operations-gate:
    name: Operations tests + deployment validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Operations test suite
        run: |
          npm run test:operations
          npm run test:monitoring
          npm run test:alerts
          npm run test:deployment-validation
          npm run test:backup-recovery
          npm run test:release-governance

      - name: Benchmark operations (offline)
        run: npm run benchmark:operations

      - name: Deployment validation
        run: npm run validate:deployment
        env:
          SESSION_SECRET: ci-only-session-secret-not-used-in-prod

      - name: Generate release manifest
        run: npm run release:manifest
        env:
          SESSION_SECRET: ci-only-session-secret-not-used-in-prod
          GITHUB_SHA: ${{ github.sha }}
          GIT_COMMIT: ${{ github.sha }}

  phase-tests:
    name: Phase 1-4 regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Phase 1-2 tests
        run: |
          npm run test:feature-consistency
          npm run test:signal-determinism
          npm run test:confidence-calibration
          npm run test:rejection-engine

      - name: Phase 3-4 tests
        run: |
          npm run test:outcome-intelligence
          npm run test:learning-snapshots
          npm run test:performance-reporting
          npm run test:adaptive-parameters
          npm run test:promotion-pipeline
          npm run test:drift-detection
          npm run test:runtime-configuration

      - name: Phase 6 multi-asset tests
        run: |
          npm run test:asset-registry
          npm run test:strategy-registry
          npm run test:market-sessions
          npm run test:multi-asset
          npm run benchmark:multi-asset

      - name: Phase 7 research tests
        run: |
          npm run test:research
          npm run test:backtesting
          npm run test:research-paper-trading
          npm run test:experiment-registry
          npm run benchmark:research

  contracts:
    name: UI source contracts (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quarantined contract tests
        run: npm run test:contracts

  full-suite:
    name: Full test suite (non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full vitest suite
        run: npm test

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["127.0.0.1:39090:9090"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../backtest-worker-alerts.yml:/etc/prometheus/rules/backtest-worker-alerts.yml:ro
    depends_on: [pushgateway]
  pushgateway:
    image: prom/pushgateway:v1.11.1
    ports: ["127.0.0.1:39091:9091"]
  grafana:
    image: grafana/grafana:12.1.0
    ports: ["127.0.0.1:33000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: validation
      GF_SECURITY_ADMIN_PASSWORD: validation-only
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/backtest.yml:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/backtest.yml:ro
      - ../backtest-worker-dashboard.json:/var/lib/grafana/dashboards/backtest-worker-dashboard.json:ro
    depends_on: [prometheus]

